# Lab metadata (bash syntax; ./lab sources it in a subshell).
TITLE="SSRF: Cloud Metadata Credential Theft"
SUMMARY="Abuse a server-side URL fetcher to steal cloud credentials. LinkPeek's /fetch endpoint retrieves any URL server-side with no allow-list, so you can make the server request the internal AWS instance metadata service at 169.254.169.254 and read the instance role's IAM credentials - keys you could never reach directly. Find the fetcher, point it at the metadata service, exfiltrate the credentials, and name the fix (allow-list, block link-local/metadata, IMDSv2)."
CATEGORY="web"      # linux / network / security / web / db / cloud / misc
TAGS="ssrf server-side-request-forgery cloud-metadata imds aws-credentials 169-254-169-254 link-local flask owasp appsec"
SOURCE="Web Security Academy - Advanced Challenges"
SERVICE="main"               # compose service that ./lab shell enters
CLEANUP_CMD=""               # run inside the container before volumes are deleted
PUBLIC="yes"                 # yes / no: show this lab on lab.uig.me
