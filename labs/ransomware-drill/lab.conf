# Lab metadata (bash syntax; ./lab sources it in a subshell).
TITLE="Ransomware Defense"
SUMMARY="A ransomware drill on a file server: make an immutable, verifiable backup, set off a simulated encryptor, detect what it did, contain it before recovering, restore with zero checksum errors, and name what the recovery point lost."
CATEGORY="security"
TAGS="ransomware backup immutable chattr sha256sum incident-response recovery rpo"
SOURCE="Ransomware Defense"
SERVICE="main"
CLEANUP_CMD="chattr -R -i /backup 2>/dev/null || true"
PUBLIC="yes"
