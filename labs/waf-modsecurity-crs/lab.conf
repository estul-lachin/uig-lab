# Lab metadata (bash syntax; ./lab sources it in a subshell).
TITLE="NGFW & WAF: ModSecurity + OWASP CRS"
SUMMARY="Protect a web app with ModSecurity v3 and the OWASP Core Rule Set. The WAF ships in DetectionOnly, so attacks pass through; turn on enforcement (SecRuleEngine On), understand CRS anomaly scoring and the 403 block, write a custom SecRule, reload, then attack the site (SQLi/XSS/LFI -> 403) and read the audit log to find the CRS rule id that fired (SQLi = 942xxx)."
CATEGORY="web"      # linux / network / security / web / db / cloud / misc
TAGS="waf modsecurity owasp-crs ngfw layer7 secruleengine anomaly-scoring paranoia-level sqli xss lfi audit-log 403"
SERVICE="main"               # compose service that ./lab shell enters (the WAF)
CLEANUP_CMD=""               # run inside the container before volumes are deleted
PUBLIC="yes"                 # yes / no: show this lab on lab.uig.me
