# Samba for an Alder Valley Water file server. @MIN@ is filled in at start-up per server.
[global]
   workgroup = AVW
   server string = %h
   server min protocol = @MIN@
   map to guest = Bad User
   log file = /var/log/samba/%m.log
   load printers = no
   disable spoolss = yes

[exports]
   path = /srv/exports
   read only = no
   valid users = ops
