# A single-node Wazuh (manager, indexer, dashboard) plus a shop server that feeds it.
# Lab-only passwords, documented in the README; nothing listens beyond localhost.
x-certs: &certs
  certs:
    condition: service_completed_successfully
services:
  # The analyst's workstation: ./lab shell and ./lab check run here.
  main:
    build: .
    hostname: analyst
    init: true
    volumes:
      - feed:/feed:ro
    networks: [lan]
  certs:
    build: { context: ., dockerfile: Dockerfile.tools }
    command: certs.sh
    volumes:
      - certs:/certs
      - webroot:/srv/www/html
      - shop-logs:/var/log/lab
    networks: [lan]
  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.14.9
    hostname: wazuh.indexer
    depends_on: *certs
    environment:
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - certs:/usr/share/wazuh-indexer/config/certs:ro
      - ./config/indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml:ro
      - ./config/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -u admin:Lab-Wazuh-2026 https://localhost:9200/_cluster/health | grep -q '\"status\":\"\\(green\\|yellow\\)\"'"]
      interval: 10s
      retries: 60
      start_period: 30s
    networks: [lan]
  wazuh.manager:
    image: wazuh/wazuh-manager:4.14.9
    hostname: wazuh.manager
    depends_on:
      <<: *certs
      wazuh.indexer: { condition: service_healthy }
    environment:
      INDEXER_URL: https://wazuh.indexer:9200
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: Lab-Wazuh-2026
      FILEBEAT_SSL_VERIFICATION_MODE: full
      SSL_CERTIFICATE_AUTHORITIES: /certs/root-ca.pem
      SSL_CERTIFICATE: /certs/wazuh.manager.pem
      SSL_KEY: /certs/wazuh.manager-key.pem
      API_USERNAME: wazuh-wui
      API_PASSWORD: MyS3cr37P450r.*-
    volumes:
      - certs:/certs:ro
      - ossec-logs:/var/ossec/logs
      - shop-logs:/var/log/lab:ro
      - webroot:/srv/www/html
      - ./config/ossec.conf:/wazuh-config-mount/etc/ossec.conf:ro
    networks: [lan]
  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.14.9
    hostname: wazuh.dashboard
    depends_on:
      <<: *certs
      wazuh.indexer: { condition: service_healthy }
    environment:
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: Lab-Wazuh-2026
      WAZUH_API_URL: https://wazuh.manager
      DASHBOARD_USERNAME: kibanaserver
      DASHBOARD_PASSWORD: Lab-Kibana-2026
      API_USERNAME: wazuh-wui
      API_PASSWORD: MyS3cr37P450r.*-
    ports:
      - "127.0.0.1:8443:5601"
    volumes:
      - certs:/usr/share/wazuh-dashboard/certs:ro
      - ./config/dashboard.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
      - ./config/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
    networks: [lan]
  # The shop server web-01: its logs and web root are what the manager watches.
  web-01:
    build: { context: ., dockerfile: Dockerfile.tools }
    command: feed.sh
    init: true
    depends_on:
      wazuh.manager: { condition: service_started }
    volumes:
      - shop-logs:/var/log/lab
      - webroot:/srv/www/html
      - ossec-logs:/var/ossec/logs:ro
      - feed:/feed
    networks: [lan]
volumes:
  certs:
  ossec-logs:
  shop-logs:
  webroot:
  feed:
networks:
  lan:
    ipam:
      config:
        - subnet: 10.253.81.0/24
