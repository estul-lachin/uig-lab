<!-- Wazuh manager for the lab: only what the alert stream needs.
     Vulnerability detection, SCA, rootcheck and inventory are off, so the alert count settles
     once the feed is done. -->
<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <email_notification>no</email_notification>
  </global>

  <alerts>
    <log_alert_level>3</log_alert_level>
  </alerts>

  <logging>
    <log_format>plain</log_format>
  </logging>

  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
  </remote>

  <rootcheck><disabled>yes</disabled></rootcheck>
  <wodle name="syscollector"><disabled>yes</disabled></wodle>
  <wodle name="cis-cat"><disabled>yes</disabled></wodle>
  <wodle name="osquery"><disabled>yes</disabled></wodle>
  <sca><enabled>no</enabled></sca>
  <vulnerability-detection><enabled>no</enabled></vulnerability-detection>

  <indexer>
    <enabled>yes</enabled>
    <hosts><host>https://wazuh.indexer:9200</host></hosts>
    <ssl>
      <certificate_authorities><ca>/certs/root-ca.pem</ca></certificate_authorities>
      <certificate>/certs/wazuh.manager.pem</certificate>
      <key>/certs/wazuh.manager-key.pem</key>
    </ssl>
  </indexer>

  <!-- File integrity monitoring of the shop's web root, in real time. -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>
    <directories realtime="yes" check_all="yes">/srv/www/html</directories>
    <skip_nfs>yes</skip_nfs>
    <skip_dev>yes</skip_dev>
    <skip_proc>yes</skip_proc>
    <skip_sys>yes</skip_sys>
  </syscheck>

  <!-- The shop server's logs, written by the feeder into a shared volume. -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/lab/auth.log</location>
  </localfile>
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/lab/access.log</location>
  </localfile>

  <ruleset>
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_exclude>0215-policy_rules.xml</rule_exclude>
    <decoder_dir>etc/decoders</decoder_dir>
    <rule_dir>etc/rules</rule_dir>
  </ruleset>

  <rule_test>
    <enabled>yes</enabled>
    <threads>1</threads>
    <max_sessions>16</max_sessions>
    <session_timeout>15m</session_timeout>
  </rule_test>

  <auth>
    <disabled>no</disabled>
    <port>1515</port>
    <use_source_ip>no</use_source_ip>
    <purge>yes</purge>
    <use_password>no</use_password>
    <ssl_manager_cert>etc/sslmanager.cert</ssl_manager_cert>
    <ssl_manager_key>etc/sslmanager.key</ssl_manager_key>
  </auth>

  <cluster>
    <name>wazuh</name>
    <node_name>node01</node_name>
    <node_type>master</node_type>
    <key>0f1e2d3c4b5a69788796a5b4c3d2e1f0</key>
    <port>1516</port>
    <bind_addr>0.0.0.0</bind_addr>
    <nodes><node>wazuh.manager</node></nodes>
    <hidden>no</hidden>
    <disabled>yes</disabled>
  </cluster>
</ossec_config>
