# Lab metadata (bash syntax; ./lab sources it in a subshell).
TITLE="SQL Injection: Authentication Bypass"
SUMMARY="Bypass a login form with SQL injection end to end: a Flask staff portal builds its query by interpolating the username and password into an f-string, so you can log in as admin without the real password using a comment (admin' --) or a tautology (' OR '1'='1). A non-legitimate admin login writes the flag; record the injection point, payload and technique for the checks."
CATEGORY="web"      # linux / network / security / web / db / cloud / misc
TAGS="sql-injection sqli auth-bypass web appsec owasp flask sqlite tautology prepared-statements login"
SOURCE="SQL Injection Basics"
