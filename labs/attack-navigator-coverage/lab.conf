# Lab metadata (bash syntax; ./lab sources it in a subshell).
TITLE="ATT&CK Navigator & Coverage Mapping"
SUMMARY="Turn an incident into measurable detection work with ATT&CK Navigator. Map a six-step intrusion to techniques, hand-build a valid Navigator layer JSON that scores the attack chain, then run a coverage gap analysis: overlay your chain against the organisation's detection layer and list the techniques you cannot yet detect - the prioritised blind spots. Covers Navigator's layer unit, the JSON save/share format, and combining layers with a score expression."
