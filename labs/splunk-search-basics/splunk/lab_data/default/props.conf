[suricata]
KV_MODE = json
SHOULD_LINEMERGE = false
TIME_PREFIX = "timestamp":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6N%z
MAX_TIMESTAMP_LOOKAHEAD = 40

[linux_secure]
SHOULD_LINEMERGE = false
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6N%:z
MAX_TIMESTAMP_LOOKAHEAD = 40

[syslog]
SHOULD_LINEMERGE = false
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6N%:z
MAX_TIMESTAMP_LOOKAHEAD = 40

# Sourcetypes for private-data/ files, by file name.
[source::/opt/private-data/access_combined.log]
sourcetype = access_combined

[source::/opt/private-data/linux_secure.log]
sourcetype = linux_secure

[source::/opt/private-data/modsecurity_audit.log]
sourcetype = modsecurity:audit

[source::/opt/private-data/suricata.log]
sourcetype = suricata
