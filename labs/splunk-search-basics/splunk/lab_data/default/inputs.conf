# Index the lab's files once, into main, with fixed sourcetypes and hosts.
[monitor:///opt/lab-data/access.log]
index = main
sourcetype = access_combined
host = web-01
disabled = 0

[monitor:///opt/lab-data/secure.log]
index = main
sourcetype = linux_secure
host = web-01
disabled = 0

[monitor:///opt/lab-data/eve.json]
index = main
sourcetype = suricata
host = ids-01
disabled = 0

[monitor:///opt/lab-data/syslog.log]
index = main
sourcetype = syslog
host = web-01
disabled = 0


# Optional: data the owner exported to private-data/ for local use only, kept in its own index.
# The directory is watched, so files added after Splunk started are picked up too.
[monitor:///opt/private-data]
index = private
host = private-export
whitelist = \.(log|json)$
# Exported files can start like the lab's own; tell them apart by path, not only by content.
crcSalt = <SOURCE>
disabled = 0
