# Lab metadata (bash syntax; ./lab sources it in a subshell).
TITLE="Group Policy (GPO)"
SUMMARY="Work with Group Policy on a live domain from a joined workstation: read the GPOs and where they are linked, tell a GPO from its link and scope, apply policy with gpupdate and read the Resultant Set of Policy, watch an OU-scoped GPO override the domain through LSDOU precedence, then find a GPO an attacker linked at the domain root to push a boot script everywhere and cut its link."
