# Lab metadata (bash syntax; ./lab sources it in a subshell).
TITLE="OS Command Injection"
SUMMARY="Chain your own commands onto a vulnerable one. NetCheck's /ping endpoint builds 'ping -c 1 <host>' and runs it in a shell, so a host value like '127.0.0.1; id' makes the shell run a second command with the web process's privileges. Recon the chaining, inject a command that writes the flag (capturing real command output), capture it, and name the fix - an argument array instead of a shell string."
CATEGORY="web"      # linux / network / security / web / db / cloud / misc
TAGS="command-injection os-command-injection rce shell metacharacters flask subprocess owasp appsec argument-array"
SOURCE="Command Injection"
SERVICE="main"               # compose service that ./lab shell enters
CLEANUP_CMD=""               # run inside the container before volumes are deleted
PUBLIC="yes"                 # yes / no: show this lab on lab.uig.me
