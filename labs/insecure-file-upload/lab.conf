# Lab metadata (bash syntax; ./lab sources it in a subshell).
TITLE="Insecure File Upload to RCE"
SUMMARY="Turn a weak upload form into remote code execution. The Snapvault app trusts the client Content-Type and saves files by their original name into a directory Apache executes, so a PHP webshell sent as image/png runs when you browse to it. Recon the check, bypass it with a spoofed Content-Type and a script extension, browse the uploaded shell to execute it, and capture the flag it writes - then name the real fix."
CATEGORY="web"      # linux / network / security / web / db / cloud / misc
TAGS="file-upload webshell rce unrestricted-upload content-type-bypass php owasp appsec remote-code-execution"
SOURCE="Insecure File Upload"
SERVICE="main"               # compose service that ./lab shell enters
CLEANUP_CMD=""               # run inside the container before volumes are deleted
PUBLIC="yes"                 # yes / no: show this lab on lab.uig.me
