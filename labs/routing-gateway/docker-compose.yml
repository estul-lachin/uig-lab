services:
  main:
    build: .
    hostname: edge-01
    init: true
    # Lets the lab change the routing table (blackhole route, removing the rogue route).
    cap_add:
      - NET_ADMIN
    networks:
      lan:
        ipv4_address: 10.253.60.10
      mgmt:
        ipv4_address: 10.253.61.10

networks:
  lan:
    ipam:
      config:
        - subnet: 10.253.60.0/24
  mgmt:
    ipam:
      config:
        - subnet: 10.253.61.0/24
