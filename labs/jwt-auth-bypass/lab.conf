# Lab metadata (bash syntax; ./lab sources it in a subshell).
TITLE="JWT Authentication Bypass (alg:none)"
SUMMARY="Forge a JSON Web Token to become an administrator. The Quillpad API issues a JWT with role=user and verifies it with a broken checker that trusts the token header's alg and accepts 'none' - skipping signature verification. Decode your token, forge one with alg:none and role=admin and no signature, call the admin endpoint, capture the flag it writes, and name the fix (pin the algorithm server-side, reject none)."
CATEGORY="web"      # linux / network / security / web / db / cloud / misc
TAGS="jwt json-web-token alg-none auth-bypass authorization forgery flask owasp appsec account-takeover"
SOURCE="JWT Authentication Bypass"
SERVICE="main"               # compose service that ./lab shell enters
CLEANUP_CMD=""               # run inside the container before volumes are deleted
PUBLIC="yes"                 # yes / no: show this lab on lab.uig.me
