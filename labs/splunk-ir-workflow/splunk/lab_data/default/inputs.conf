# Index the lab's files once, into main. Windows events come through the event collector wec-01.
[monitor:///opt/lab-data/wineventlog.json]
index = main
sourcetype = wineventlog:json
host = wec-01
disabled = 0

[monitor:///opt/lab-data/fw.log]
index = main
sourcetype = fw:traffic
host = fw-01
disabled = 0
