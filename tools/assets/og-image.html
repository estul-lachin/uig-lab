<!doctype html>
<!-- Source of og-image.png (1200x630). Re-render with tools/render_assets.sh after editing. -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% -10%, rgba(57,255,136,0.12), transparent 60%), #0a0f0b;
    color: #cdeed6; box-sizing: border-box; padding: 80px 90px; position: relative;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    display: flex; flex-direction: column;
  }
  body::before {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(to bottom, transparent 0, transparent 2px, rgba(0,0,0,0.25) 3px, transparent 4px);
  }
  .top { display: flex; align-items: center; gap: 24px; }
  .top img { width: 84px; height: 84px; }
  .name { font-size: 38px; font-weight: 600; color: #86a891; }
  .name::before { content: "~$ "; color: #39ff88; }
  h1 { font-size: 84px; line-height: 1.05; margin: 56px 0 24px; letter-spacing: -0.02em; }
  h1::before { content: "> "; color: #39ff88; text-shadow: 0 0 14px rgba(57,255,136,0.6); }
  h1::after { content: ""; display: inline-block; width: 0.5em; height: 0.9em; margin-left: 12px; vertical-align: -0.08em;
    background: #39ff88; box-shadow: 0 0 14px rgba(57,255,136,0.6); }
  .by { font-size: 30px; color: #86a891; }
  .url { margin-top: auto; font-size: 32px; color: #39ff88; text-shadow: 0 0 10px rgba(57,255,136,0.5); }
</style></head><body>
  <div class="top"><img src="favicon.svg" alt=""><span class="name">Estul Lachin</span></div>
  <h1>Hands-on IT labs</h1>
  <div class="by">Security operations &amp; IT support · Edmonton, AB</div>
  <div class="url">lab.uig.me</div>
</body></html>
